
services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=teamdb
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=geheim
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgres://admin:geheim@db:5432/teamdb
    depends_on:
      - db

volumes:
  postgres_data: